name: CI

# Runs on PRs and on pushes to the deploy branches. Railway "Wait for CI" holds each
# deploy until this workflow is green on the pushed commit (docs/railway.md).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1" # fail if uv.lock is out of date instead of rewriting it
  NEXT_TELEMETRY_DISABLED: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  # Each job's timeout-minutes is about twice its slowest healthy green run (#364), so a
  # stuck job fails instead of blocking reviews for an hour.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # green runs: median 7, slowest 12.3 min
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jack
          POSTGRES_PASSWORD: jack
          POSTGRES_DB: jack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jack -d jack"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://jack:jack@127.0.0.1:5432/jack
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (no moving major tag)
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - name: Migrations upgrade, downgrade, upgrade
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      # The media copy tests run ffmpeg and ffprobe (#173); in CI they fail without them.
      # When the runner's Ubuntu mirror stops resolving, apt crawls for up to an hour (#364).
      # Each attempt's downloads get a time limit; a failed attempt is retried and reuses the
      # .deb files it already downloaded.
      - name: Install ffmpeg
        timeout-minutes: 10
        env:
          ATTEMPTS: "3"
          ATTEMPT_TIMEOUT: 150s # update + download of one attempt; healthy runs take 10-180 s
        run: |
          fetch_packages() {
            sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=10s "$ATTEMPT_TIMEOUT" bash -c '
              apt-get -q -o Acquire::Retries=3 update &&
              apt-get -q -y -o Acquire::Retries=3 --no-install-recommends --download-only install ffmpeg'
          }
          # Installs only what fetch_packages downloaded: no network, so no time limit.
          install_from_cache() {
            sudo DEBIAN_FRONTEND=noninteractive apt-get -q -y --no-install-recommends --no-download install ffmpeg
          }
          for attempt in $(seq 1 "$ATTEMPTS"); do
            rc=0
            { fetch_packages && install_from_cache; } || rc=$?
            if [ "$rc" -eq 0 ]; then
              dpkg-query -W ffmpeg
              exit 0
            fi
            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              delay=$((attempt * 10))
              echo "::warning::Install ffmpeg attempt $attempt of $ATTEMPTS failed (exit $rc; 124 = over $ATTEMPT_TIMEOUT). Retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "::error::Install ffmpeg failed $ATTEMPTS times (last exit $rc): the runner's apt mirror is unreachable or too slow. Re-run the job (#364)."
          exit 1
      - run: uv run pytest

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # green runs: median 3.5, slowest 4.7 min
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm --filter @jack/web build
      # JS bundles only: catches Metro, Babel and NativeWind errors. Device builds run on EAS.
      - name: Bundle mobile (android)
        run: pnpm --filter @jack/mobile exec expo export --platform android --output-dir dist-ci
      - name: Bundle mobile (ios)
        run: pnpm --filter @jack/mobile exec expo export --platform ios --output-dir dist-ci

  contract:
    runs-on: ubuntu-latest
    # Green runs: median 0.5, slowest 0.8 min. Twice that is under 2 min, so 5 leaves room for
    # cold pnpm and uv caches.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (no moving major tag)
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api-types
      - name: packages/shared matches the API schema
        run: |
          git diff --exit-code packages/shared
          test -z "$(git status --porcelain packages/shared)" || {
            git status --porcelain packages/shared
            echo "::error::Run 'pnpm gen:api-types' and commit packages/shared."
            exit 1
          }
