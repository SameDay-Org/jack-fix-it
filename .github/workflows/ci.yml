name: CI

# Runs on PRs and on pushes to the deploy branches. Railway "Wait for CI" holds each
# deploy until this workflow is green on the pushed commit (docs/railway.md).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1" # fail if uv.lock is out of date instead of rewriting it
  NEXT_TELEMETRY_DISABLED: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  # Each job's timeout-minutes is about twice its slowest healthy green run (#364), so a
  # stuck job fails instead of blocking reviews for an hour.
  # The API's tests run in two jobs at once, each with half of the test files (#613: one job
  # reached its 25-minute limit). tests/sharding.py makes the split from the files alone, so
  # both jobs agree, and tests/test_sharding.py proves the two halves are the whole suite.
  # The checks before the tests run once, in the first job. Standard runners only.
  api:
    name: api (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25 # one job ran all the tests: median 7, slowest 23 min (#613)
    strategy:
      # Both halves report even when one fails, so a review sees every failure at once.
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jack
          POSTGRES_PASSWORD: jack
          POSTGRES_DB: jack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jack -d jack"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://jack:jack@127.0.0.1:5432/jack
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTEST_SHARD: ${{ matrix.shard }}/2
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (no moving major tag)
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync
      - if: matrix.shard == 1
        run: uv run ruff check .
      - if: matrix.shard == 1
        run: uv run ruff format --check .
      - if: matrix.shard == 1
        run: uv run mypy .
      # The demo video's scripts (docs/demo-video.md) run in this environment and follow the
      # same rules; tests/test_demo_seed.py runs the seed itself.
      - name: Demo scripts (lint, format, types)
        if: matrix.shard == 1
        run: |
          uv run ruff check ../../scripts/demo
          uv run ruff format --check ../../scripts/demo
          uv run mypy ../../scripts/demo
      - name: Migrations upgrade, downgrade, upgrade
        if: matrix.shard == 1
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      # The media copy tests run ffmpeg and ffprobe (#173); in CI they fail without them.
      # Their .deb files are cached per runner image (#626): with the cache, nothing comes from
      # the apt mirror, which has timed out on both shards (#364, #613). A new runner image
      # misses the cache once and fetches as below; a cached install that fails also falls
      # back to the fetch.
      - name: ffmpeg cache key
        id: ffmpeg-key
        run: echo "key=ffmpeg-debs-${ImageOS:-unknown}-${ImageVersion:-unknown}-v1" >> "$GITHUB_OUTPUT"
      - name: Restore the ffmpeg packages
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/ffmpeg-debs
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - name: Install ffmpeg from the cache
        id: ffmpeg-cached
        if: steps.ffmpeg-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          sudo DEBIAN_FRONTEND=noninteractive dpkg -i ~/ffmpeg-debs/*.deb
          dpkg-query -W ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      # When the runner's Ubuntu mirror stops resolving, apt crawls for up to an hour (#364).
      # Each attempt's downloads get a time limit; a failed attempt is retried and reuses the
      # .deb files it already downloaded. A successful fetch keeps its .deb files for the cache.
      - name: Install ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' || steps.ffmpeg-cached.outcome == 'failure'
        timeout-minutes: 10
        env:
          ATTEMPTS: "3"
          ATTEMPT_TIMEOUT: 150s # update + download of one attempt; healthy runs take 10-180 s
        run: |
          fetch_packages() {
            sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=10s "$ATTEMPT_TIMEOUT" bash -c '
              apt-get -q -o Acquire::Retries=3 update &&
              apt-get -q -y -o Acquire::Retries=3 --no-install-recommends --download-only install ffmpeg'
          }
          # Installs only what fetch_packages downloaded: no network, so no time limit.
          install_from_cache() {
            sudo DEBIAN_FRONTEND=noninteractive apt-get -q -y --no-install-recommends --no-download install ffmpeg
          }
          for attempt in $(seq 1 "$ATTEMPTS"); do
            rc=0
            { fetch_packages && install_from_cache; } || rc=$?
            if [ "$rc" -eq 0 ]; then
              dpkg-query -W ffmpeg
              # For the cache: what apt fetched (nothing to keep if the image had it all).
              mkdir -p ~/ffmpeg-debs
              cp /var/cache/apt/archives/*.deb ~/ffmpeg-debs/ 2>/dev/null || true
              exit 0
            fi
            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              delay=$((attempt * 10))
              echo "::warning::Install ffmpeg attempt $attempt of $ATTEMPTS failed (exit $rc; 124 = over $ATTEMPT_TIMEOUT). Retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "::error::Install ffmpeg failed $ATTEMPTS times (last exit $rc): the runner's apt mirror is unreachable or too slow. Re-run the job (#364)."
          exit 1
      # Saved as soon as the fetch worked, whatever the tests do next; the shard that saves second
      # only warns that the key is taken.
      - name: Save the ffmpeg packages
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/ffmpeg-debs
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - name: Tests (half ${{ matrix.shard }} of 2)
        run: uv run pytest

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # green runs: median 3.5, slowest 4.7 min
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      # The demo tour's host guard, proven in a real browser (docs/demo-video.md): the runner's
      # own Chrome, nothing downloaded. Its one dependency is outside the workspace.
      - name: Demo tour guard
        working-directory: scripts/demo
        timeout-minutes: 5
        env:
          DEMO_BROWSER_CHANNEL: chrome
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          node --test
      - run: pnpm --filter @jack/web build
      # First-load JavaScript of the showcase page against its budget (#403); needs the build.
      - run: pnpm --filter @jack/web check:bundle
      # JS bundles only: catches Metro, Babel and NativeWind errors. Device builds run on EAS.
      - name: Bundle mobile (android)
        run: pnpm --filter @jack/mobile exec expo export --platform android --output-dir dist-ci
      - name: Bundle mobile (ios)
        run: pnpm --filter @jack/mobile exec expo export --platform ios --output-dir dist-ci

  contract:
    runs-on: ubuntu-latest
    # Green runs: median 0.5, slowest 0.8 min. Twice that is under 2 min, so 5 leaves room for
    # cold pnpm and uv caches.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 (no moving major tag)
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api-types
      - name: packages/shared matches the API schema
        run: |
          git diff --exit-code packages/shared
          test -z "$(git status --porcelain packages/shared)" || {
            git status --porcelain packages/shared
            echo "::error::Run 'pnpm gen:api-types' and commit packages/shared."
            exit 1
          }
